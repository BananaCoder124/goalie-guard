<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalieGuard</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameArea {
            background: #2ed573;
            border: 4px solid white;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: none;
        }
        .line {
            position: absolute;
            bottom: 50px;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.5);
        }
        #scoreBoard {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
            display: flex;
            gap: 20px;
        }
        #gameOverText {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            background: rgba(0,0,0,0.85);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #ff6b81; }
        
        /* Tyylikäs linkin kopiointipainike */
        .copy-btn {
            background: #2f3542;
            border: 1px solid #57606f;
            font-size: 16px;
        }
        .copy-btn:hover {
            background: #57606f;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">
        <div>Score: <span id="scoreValue">0</span></div>
        <div>Best: <span id="highScoreValue">0</span></div>
    </div>
    
    <div id="gameArea">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        <div id="gameOverText">
            GAME OVER!<br>
            <div class="btn-container">
                <button onclick="startGame()">Play Again</button>
                <button id="copyBtn" class="copy-btn" onclick="copyGameLink()">🔗 Copy Game Link</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gameOverText = document.getElementById("gameOverText");
        const scoreValue = document.getElementById("scoreValue");
        const highScoreValue = document.getElementById("highScoreValue");
        const copyBtn = document.getElementById("copyBtn");

        // Game variables
        let score = 0;
        let highScore = localStorage.getItem("goalieGuardHighScore") || 0;
        let gameRunning = true;

        // Display initial high score
        highScoreValue.innerText = highScore;

        // Goalkeeper (Player)
        const player = {
            x: 175,
            y: 460,
            width: 70,
            height: 15,
            color: "#1e90ff"
        };

        // Ball
        const ball = {
            x: 200,
            y: 50,
            radius: 12,
            speedX: 3,
            speedY: 4,
            color: "#ffffff"
        };

        // Mouse controls
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left - player.width / 2;
            
            // Prevent the goalkeeper from going out of bounds
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        });

        // Touch controls (mobile)
        canvas.addEventListener("touchmove", (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.touches[0].clientX - rect.left - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            e.preventDefault();
        });

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = 50;
            ball.speedY = 4 + score * 0.5; // Increases difficulty based on score
            ball.speedX = (Math.random() - 0.5) * 6;
        }

        function update() {
            if (!gameRunning) return;

            // Move the ball
            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // Wall collision (left/right)
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.speedX = -ball.speedX;
            }

            // Ceiling collision
            if (ball.y - ball.radius < 0) {
                ball.speedY = -ball.speedY;
            }

            // Goalkeeper (player) collision
            if (ball.y + ball.radius >= player.y && 
                ball.x >= player.x && 
                ball.x <= player.x + player.width && 
                ball.y - ball.radius < player.y + player.height) {
                
                ball.speedY = -ball.speedY;
                score++;
                scoreValue.innerText = score;
                
                // Add some spin depending on where the ball hits the paddle
                let hitPoint = ball.x - (player.x + player.width / 2);
                ball.speedX = hitPoint * 0.15;
            }

            // Ball goes past the player (goal conceded)
            if (ball.y > canvas.height) {
                gameRunning = false;
                
                // Check and save High Score
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("goalieGuardHighScore", highScore);
                    highScoreValue.innerText = highScore;
                }
                
                gameOverText.style.display = "block";
            }
        }

        function draw() {
            // Clear field
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw center circle and lines (football pitch look)
            ctx.strokeStyle = "rgba(255,255,255,0.3)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 0, 80, 0, Math.PI);
            ctx.stroke();

            // Draw player (goalkeeper)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw ball
            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            score = 0;
            scoreValue.innerText = score;
            gameRunning = true;
            gameOverText.style.display = "none";
            // Palautetaan painikkeen teksti, jos se oli kopioitu-tilassa
            copyBtn.innerHTML = "🔗 Copy Game Link";
            resetBall();
        }

        // Toiminto, joka kopioi livenä olevan pelin osoitteen leikepöydälle
        function copyGameLink() {
            const playUrl = "https://bananacoder124.github.io/goalie-guard/";
            
            navigator.clipboard.writeText(playUrl).then(() => {
                copyBtn.innerHTML = "✅ Copied!";
                setTimeout(() => {
                    copyBtn.innerHTML = "🔗 Copy Game Link";
                }, 2000);
            }).catch(err => {
                console.error("Linkin kopiointi epäonnistui: ", err);
            });
        }

        // Start the game for the first time
        startGame();
        gameLoop();
    </script>
</body>
</html>
