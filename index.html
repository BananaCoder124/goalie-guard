<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalieGuard</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* Pelin nimen tyyli ja korkeussijainti */
        .game-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 35px; /* Nostaa nimen ylemmäs luomalla tilaa sen alle */
            color: #1e90ff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
            text-transform: none; /* Estää automaattiset suuraakkoset */
        }
        #gameArea {
            background: #2ed573;
            border: 4px solid white;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: none;
        }
        .line {
            position: absolute;
            bottom: 50px;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.5);
        }
        #scoreBoard {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
            display: flex;
            gap: 20px;
        }
        #gameOverText {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            background: rgba(0,0,0,0.85);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #ff6b81;
        }
        .copy-btn {
            background: #2f3542;
            border: 1px solid #57606f;
            font-size: 16px;
        }
        .copy-btn:hover {
            background: #57606f;
        }
    </style>
</head>
<body>

    <!-- Pelin nimi lisätty halutussa muodossa -->
    <div class="game-title">GoalieGuard</div>

    <div id="scoreBoard">
        <div>Score: <span id="scoreValue">0</span></div>
        <div>Best: <span id="highScoreValue">0</span></div>
    </div>

    <div id="gameArea">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <div id="gameOverText">
            GAME OVER!<br>
            <div class="btn-container">
                <button onclick="startGame()">Play Again</button>
                <button id="copyBtn" class="copy-btn" onclick="copyGameLink()">🔗 Copy Game Link</button>
            </div>
        </div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const gameOverText = document.getElementById("gameOverText");
const scoreValue = document.getElementById("scoreValue");
const highScoreValue = document.getElementById("highScoreValue");
const copyBtn = document.getElementById("copyBtn");

// Pelimuuttujat
let score = 0;
let highScore = localStorage.getItem("goalieGuardHighScore") || 0;
let gameRunning = false;
let currentSpeed = 5; 
let animationFrameId;

highScoreValue.innerText = highScore;

// Maalivahti (Pelaaja)
const player = { x: 175, y: 460, width: 70, height: 15, color: "#1e90ff" };
// Pallo
const ball = { x: 200, y: 50, radius: 12, speedX: 0, speedY: 0, color: "#ffffff" };

// Hiiriohjaus
canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    player.x = e.clientX - rect.left - player.width / 2;
    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
});

// Kosketusohjaus mobiilille
canvas.addEventListener("touchmove", (e) => {
    const rect = canvas.getBoundingClientRect();
    player.x = e.touches[0].clientX - rect.left - player.width / 2;
    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
    e.preventDefault();
});

function setBallVelocity(angle) {
    ball.speedX = Math.cos(angle) * currentSpeed;
    ball.speedY = Math.sin(angle) * currentSpeed;
}

function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = 50;
    currentSpeed = 5; 
    let randomAngle = (Math.random() * 90 + 45) * Math.PI / 180;
    setBallVelocity(randomAngle);
}

function update() {
    if (!gameRunning) return;

    currentSpeed += 0.002;
    let currentAngle = Math.atan2(ball.speedY, ball.speedX);
    setBallVelocity(currentAngle);

    ball.x += ball.speedX;
    ball.y += ball.speedY;

    if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.speedX = -ball.speedX; }
    if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.speedX = -ball.speedX; }
    if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.speedY = -ball.speedY; }

    if (ball.y + ball.radius >= player.y && ball.x >= player.x && ball.x <= player.x + player.width && ball.y - ball.radius < player.y + player.height) {
        score++;
        scoreValue.innerText = score;
        let hitPoint = (ball.x - (player.x + player.width / 2)) / (player.width / 2);
        let bounceAngle = (hitPoint * 60 - 90) * Math.PI / 180;
        setBallVelocity(bounceAngle);
        ball.y = player.y - ball.radius;
    }

    if (ball.y > canvas.height) {
        gameRunning = false;
        cancelAnimationFrame(animationFrameId);
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("goalieGuardHighScore", highScore);
            highScoreValue.innerText = highScore;
        }
        gameOverText.style.display = "block";
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(canvas.width / 2, 0, 80, 0, Math.PI);
    ctx.stroke();

    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    ctx.fillStyle = ball.color;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 1;
    ctx.stroke();
}

function gameLoop() {
    if (!gameRunning) return;
    update();
    draw();
    animationFrameId = requestAnimationFrame(gameLoop);
}

function startGame() {
    cancelAnimationFrame(animationFrameId);
    score = 0;
    scoreValue.innerText = score;
    gameRunning = true;
    gameOverText.style.display = "none";
    copyBtn.innerHTML = "🔗 Copy Game Link";
    resetBall();
    gameLoop();
}

// Luotettava linkin kopiointitoiminto varajärjestelmällä (Fallback)
function copyGameLink() {
    const playUrl = "https://bananacoder124.github.io/goalie-guard/";

    // Yritetään ensin Clipboard API:a
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(playUrl).then(() => {
            showCopiedSuccess();
        }).catch(err => {
            console.warn("Clipboard API epäonnistui, yritetään varakeinoa...", err);
            fallbackCopyText(playUrl);
        });
    } else {
        fallbackCopyText(playUrl);
    }
}

// Varakeino kopioinnille (luodaan näkymätön tekstikenttä)
function fallbackCopyText(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    
    textArea.style.top = "0";
    textArea.style.left = "0";
    textArea.style.position = "fixed";
    textArea.style.opacity = "0";
    
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
        const successful = document.execCommand('copy');
        if (successful) {
            showCopiedSuccess();
        } else {
            alert("Kopiointi epäonnistui. Voit kopioida linkin tästä: " + text);
        }
    } catch (err) {
        console.error("Varakeinokin epäonnistui: ", err);
        alert("Kopiointi epäonnistui. Voit kopioida linkin tästä: " + text);
    }
    document.body.removeChild(textArea);
}

// Visuaalinen palaute onnistuneesta kopioinnista
function showCopiedSuccess() {
    copyBtn.innerHTML = "✅ Copied!";
    setTimeout(() => {
        copyBtn.innerHTML = "🔗 Copy Game Link";
    }, 2000);
}

// Aloitetaan peli automaattisesti
startGame();
</script>
</body>
</html>
